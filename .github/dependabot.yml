# edit this in https://github.com/conda/infrastructure

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
    groups:
      workflows:
        patterns:
          - '*'
    cooldown:
      default-days: 7
      exclude:
        - conda/actions
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns:
          - '*'
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: conda-sphinx-theme
      - dependency-name: mdit-py-plugins
      - dependency-name: myst-parser
      - dependency-name: sphinx
      - dependency-name: sphinx-argparse
      - dependency-name: sphinx-copybutton
      - dependency-name: sphinx-design
      - dependency-name: sphinx-sitemap
    groups:
      docs:
        patterns:
          - '*'
    cooldown:
      default-days: 7
